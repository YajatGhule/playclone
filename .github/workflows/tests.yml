name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - name: Python tests (includes the JS/Python matcher parity check)
        run: uv run --python 3.12 pytest -q
      - name: Browser matcher tests
        run: node --test tests/js/*.test.mjs
